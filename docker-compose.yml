version: '3.8'
services:
  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    ports: [ "8000:8000" ]
    environment:
      - GATEWAY_API_KEY=dev-secret-key
      - COMPLIANCE_AGENT_URL=http://compliance-agent:8003/sanitize
      - DIAGNOSTIC_AGENT_URL=http://diagnostic-agent:8001/analyze
      - REMEDIATION_AGENT_URL=http://remediation-agent:8002/remediate
  diagnostic-agent:
    build: { context: ., dockerfile: agents/diagnostic/Dockerfile }
    ports: [ "8001:8001" ]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
  remediation-agent:
    build: { context: ., dockerfile: agents/remediation/Dockerfile }
    ports: [ "8002:8002" ]
  compliance-agent:
    build: { context: ., dockerfile: agents/compliance/Dockerfile }
    ports: [ "8003:8003" ]
